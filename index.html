<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="navy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>نقطة تركيز | Anti-Overwhelm Focus</title>
  <style>
    /* =========================================
       1. CSS VARIABLES & THEMES
       ========================================= */
    :root,
    [data-theme="navy"] {
      --bg-primary: #0b1320;
      --bg-card: #131e30;
      --bg-elevated: #19273e;
      --bg-input: #0e1828;
      --border-color: #1f304a;
      --border-focus: #38bdf8;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --accent-text: #082f49;
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.14);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.14);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.14);
      --shadow-card: 0 12px 32px -8px rgba(0, 0, 0, 0.45);
      --overlay-bg: rgba(5, 9, 17, 0.78);
    }

    [data-theme="dark"] {
      --bg-primary: #000000;
      --bg-card: #121212;
      --bg-elevated: #1c1c1c;
      --bg-input: #0a0a0a;
      --border-color: #262626;
      --border-focus: #60a5fa;
      --text-primary: #f5f5f5;
      --text-secondary: #a3a3a3;
      --text-muted: #737373;
      --accent: #60a5fa;
      --accent-hover: #3b82f6;
      --accent-text: #0a0a0a;
      --success: #4ade80;
      --success-bg: rgba(74, 222, 128, 0.14);
      --danger: #f87171;
      --danger-bg: rgba(248, 113, 113, 0.14);
      --warning: #fbbf24;
      --warning-bg: rgba(251, 191, 36, 0.14);
      --shadow-card: 0 12px 32px -8px rgba(0, 0, 0, 0.85);
      --overlay-bg: rgba(0, 0, 0, 0.85);
    }

    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-card: #ffffff;
      --bg-elevated: #f1f5f9;
      --bg-input: #f8fafc;
      --border-color: #e2e8f0;
      --border-focus: #0284c7;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --accent-text: #ffffff;
      --success: #16a34a;
      --success-bg: rgba(22, 163, 74, 0.12);
      --danger: #dc2626;
      --danger-bg: rgba(220, 38, 38, 0.12);
      --warning: #d97706;
      --warning-bg: rgba(217, 119, 6, 0.12);
      --shadow-card: 0 10px 28px -6px rgba(15, 23, 42, 0.08);
      --overlay-bg: rgba(15, 23, 42, 0.55);
    }

    /* =========================================
       2. RESET & BASE STYLES
       ========================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans Arabic", sans-serif;
      line-height: 1.55;
      transition: background-color 0.25s ease, color 0.25s ease;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    button, input, textarea, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      min-height: 44px;
      min-width: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      border-radius: 12px;
      font-weight: 600;
      transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* =========================================
       3. TOP BAR (MINIMAL HEADER)
       ========================================= */
    .top-bar {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .bar-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .icon-pill {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 0 0.85rem;
      font-size: 0.875rem;
      height: 44px;
    }

    .icon-pill:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    /* Slot Count Selector (1 / 2 / 3) */
    .slot-selector {
      display: inline-flex;
      align-items: center;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 3px;
      height: 44px;
    }

    .slot-btn {
      min-height: 36px;
      min-width: 36px;
      padding: 0 0.6rem;
      font-size: 0.875rem;
      border-radius: 9px;
      color: var(--text-secondary);
    }

    .slot-btn.active {
      background-color: var(--accent);
      color: var(--accent-text);
    }

    /* Vault Button */
    .vault-btn {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0 1rem;
      font-size: 0.925rem;
    }

    .vault-btn:hover {
      border-color: var(--accent);
      background-color: var(--bg-elevated);
    }

    /* =========================================
       4. MAIN FOCUS STAGE
       ========================================= */
    .focus-stage {
      flex: 1;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.25rem;
    }

    .focus-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      padding: 2rem 1.75rem;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      transition: transform 0.25s ease, border-color 0.25s ease, background-color 0.25s ease;
      animation: fadeSlideIn 0.28s ease;
    }

    .focus-card.is-mandatory {
      border-color: var(--warning);
    }

    .focus-card.is-overdue {
      border-color: var(--danger);
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Badges Row inside Focus Card */
    .card-badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.28rem 0.7rem;
      border-radius: 999px;
      background-color: var(--bg-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }

    .badge svg {
      width: 14px;
      height: 14px;
    }

    .badge-mandatory {
      background-color: var(--warning-bg);
      color: var(--warning);
      border-color: transparent;
    }

    .badge-deadline {
      background-color: var(--bg-elevated);
      color: var(--accent);
      border-color: transparent;
    }

    .badge-deadline.urgent {
      background-color: var(--warning-bg);
      color: var(--warning);
    }

    .badge-deadline.overdue {
      background-color: var(--danger-bg);
      color: var(--danger);
    }

    /* Task Typography */
    .task-title {
      font-size: clamp(1.35rem, 3.5vw, 1.85rem);
      font-weight: 700;
      line-height: 1.4;
      color: var(--text-primary);
      word-break: break-word;
    }

    .task-note {
      font-size: 1.02rem;
      color: var(--text-secondary);
      line-height: 1.65;
      white-space: pre-line;
      word-break: break-word;
    }

    /* Action Buttons inside Focus Card */
    .card-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }

    .btn-done {
      flex: 1;
      min-width: 140px;
      background-color: var(--accent);
      color: var(--accent-text);
      font-size: 1rem;
      padding: 0.75rem 1.25rem;
      border-radius: 14px;
    }

    .btn-done:hover {
      background-color: var(--accent-hover);
    }

    .btn-defer {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      font-size: 0.95rem;
      padding: 0.75rem 1.15rem;
      border-radius: 14px;
    }

    .btn-defer:hover {
      color: var(--text-primary);
      border-color: var(--text-muted);
    }

    /* Resting / Pull Next State Card */
    .rest-card {
      background-color: var(--bg-card);
      border: 1px dashed var(--border-color);
      border-radius: 22px;
      padding: 2.25rem 1.5rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      animation: fadeSlideIn 0.25s ease;
    }

    .rest-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: var(--success-bg);
      color: var(--success);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rest-icon.empty-vault-icon {
      background-color: var(--bg-elevated);
      color: var(--accent);
    }

    .rest-message {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .rest-sub {
      font-size: 0.92rem;
      color: var(--text-secondary);
      max-width: 360px;
    }

    .btn-pull {
      background-color: var(--bg-elevated);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.7rem 1.5rem;
      font-size: 0.98rem;
      border-radius: 14px;
      margin-top: 0.25rem;
    }

    .btn-pull:hover {
      background-color: var(--accent);
      color: var(--accent-text);
    }

    /* =========================================
       5. VAULT MODAL
       ========================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: var(--overlay-bg);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      padding-top: max(1rem, env(safe-area-inset-top));
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .vault-modal {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      width: 100%;
      max-width: 680px;
      max-height: 90dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }

    .vault-header {
      padding: 1.1rem 1.35rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .vault-title {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-close {
      background-color: var(--bg-elevated);
      color: var(--text-secondary);
      border-radius: 12px;
    }

    .btn-close:hover {
      color: var(--text-primary);
    }

    /* Vault Tabs */
    .vault-tabs {
      display: flex;
      padding: 0.65rem 1.35rem 0;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-primary);
    }

    .tab-btn {
      flex: 1;
      border-radius: 12px 12px 0 0;
      border: 1px solid transparent;
      border-bottom: none;
      color: var(--text-secondary);
      font-size: 0.95rem;
      padding: 0.65rem 1rem;
      position: relative;
      bottom: -1px;
    }

    .tab-btn.active {
      background-color: var(--bg-card);
      border-color: var(--border-color);
      color: var(--accent);
    }

    .tab-count {
      font-size: 0.78rem;
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
      background-color: var(--bg-elevated);
      color: var(--text-secondary);
    }

    .tab-btn.active .tab-count {
      background-color: var(--accent);
      color: var(--accent-text);
    }

    /* Vault Body */
    .vault-body {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 1.35rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      overscroll-behavior: contain;
    }

    /* Task Form */
    .task-form {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      align-items: end;
    }

    .form-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .form-input {
      width: 100%;
      min-height: 44px;
      padding: 0.6rem 0.85rem;
      border-radius: 11px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-input);
      color: var(--text-primary);
      font-size: 16px; /* Prevents iOS Safari auto-zoom */
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--border-focus);
    }

    /* Mandatory Toggle Switch */
    .toggle-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      padding: 0.5rem 0.85rem;
      border-radius: 11px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-input);
      cursor: pointer;
      user-select: none;
    }

    .toggle-label-text {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .switch-track {
      width: 44px;
      height: 24px;
      border-radius: 999px;
      background-color: var(--border-color);
      position: relative;
      transition: background-color 0.2s ease;
      flex-shrink: 0;
    }

    .switch-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background-color: #ffffff;
      position: absolute;
      top: 3px;
      inset-inline-start: 3px;
      transition: transform 0.2s ease;
    }

    input[type="checkbox"]:checked + .switch-track {
      background-color: var(--warning);
    }

    [dir="rtl"] input[type="checkbox"]:checked + .switch-track .switch-thumb {
      transform: translateX(-20px);
    }

    [dir="ltr"] input[type="checkbox"]:checked + .switch-track .switch-thumb {
      transform: translateX(20px);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    .form-actions {
      display: flex;
      gap: 0.6rem;
      justify-content: flex-end;
    }

    .btn-primary {
      background-color: var(--accent);
      color: var(--accent-text);
      padding: 0 1.25rem;
      font-size: 0.95rem;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 0 1rem;
      font-size: 0.9rem;
    }

    /* Queue & Completed Lists */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      position: relative;
    }

    .list-item {
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.15s ease;
      user-select: none;
    }

    .list-item.is-active-slot {
      border-inline-start: 3px solid var(--accent);
    }

    .list-item.dragging {
      opacity: 0.88;
      background-color: var(--bg-elevated);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      z-index: 10;
    }

    .drag-handle {
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: grab;
      touch-action: none;
      border-radius: 10px;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .drag-handle:active {
      cursor: grabbing;
      color: var(--accent);
      background-color: var(--bg-elevated);
    }

    .item-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .item-title {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text-primary);
      word-break: break-word;
    }

    .item-note {
      font-size: 0.84rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.15rem;
    }

    .mini-tag {
      font-size: 0.74rem;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
      background-color: var(--bg-elevated);
      color: var(--text-secondary);
    }

    .mini-tag.active-tag {
      background-color: rgba(56, 189, 248, 0.15);
      color: var(--accent);
    }

    .mini-tag.mandatory-tag {
      background-color: var(--warning-bg);
      color: var(--warning);
    }

    .mini-tag.overdue-tag {
      background-color: var(--danger-bg);
      color: var(--danger);
    }

    .item-controls {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      flex-shrink: 0;
    }

    .ctrl-btn {
      min-width: 44px;
      min-height: 44px;
      border-radius: 10px;
      color: var(--text-secondary);
      background-color: transparent;
    }

    .ctrl-btn:hover:not(:disabled) {
      background-color: var(--bg-elevated);
      color: var(--text-primary);
    }

    .ctrl-btn:disabled {
      opacity: 0.28;
      cursor: not-allowed;
    }

    .ctrl-btn.danger:hover {
      background-color: var(--danger-bg);
      color: var(--danger);
    }

    /* Completed Header Bar */
    .completed-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .btn-clear-history {
      background-color: var(--danger-bg);
      color: var(--danger);
      padding: 0 0.95rem;
      font-size: 0.85rem;
      margin-inline-start: auto;
    }

    .confirm-bar {
      width: 100%;
      background-color: var(--danger-bg);
      border: 1px solid var(--danger);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      font-size: 0.9rem;
    }

    .empty-list-msg {
      text-align: center;
      padding: 2.25rem 1rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* =========================================
       6. RESPONSIVE ADJUSTMENTS
       ========================================= */
    @media (max-width: 600px) {
      .top-bar {
        padding: 0.75rem 0.9rem;
      }

      .focus-stage {
        padding: 1rem 0.9rem 2rem;
      }

      .focus-card {
        padding: 1.5rem 1.25rem;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .list-item {
        flex-wrap: wrap;
      }

      .item-controls {
        width: 100%;
        justify-content: flex-end;
        border-top: 1px solid var(--border-color);
        padding-top: 0.4rem;
        margin-top: 0.2rem;
      }
    }
  </style>
</head>
<body>

  <!-- TOP MINIMAL HEADER -->
  <header class="top-bar">
    <div class="bar-group">
      <button type="button" id="themeBtn" class="icon-pill" aria-label="Theme">

      'use strict';

      /* =========================================
         1. TRANSLATIONS DICTIONARY (AR / EN)

          confirmYes: 'نعم، امسح',

        },
        en: {
          appTitle: 'Focus Point | Anti-Overwhelm Tasks',
          themeNavy: 'Navy Dark',
          themeDark: 'Pure Dark',
          themeLight: 'Light',
          langSwitch: 'AR',
          slotsAria: 'Visible focus slots',
          vaultBtn: 'The Vault',
          doneBtn: 'Done',
          deferBtn: 'Defer',
          pullNextBtn: 'Pull Next Task',
          completedMsg: 'Current task completed',
          completedSubWithQueue: 'Take a mental breath, then pull your next task when ready.',
          completedSubEmpty: 'You cleared everything in the Vault. Enjoy the calm.',
          emptyVaultTitle: 'No active tasks right now',
          emptyVaultSub: 'Open the Vault to add a clear task when you are ready.',
          openVaultAction: 'Open The Vault',
          mandatoryBadge: 'Mandatory',
          mandatoryAutoBadge: 'Mandatory (Due Soon)',
          overdueBadge: 'Overdue',
          deadlinePrefix: 'Due:',
          tabQueue: 'Queue',
          tabCompleted: 'Completed',
          labelTaskTitle: 'Task Name *',
          placeholderTaskTitle: 'What is the one thing to get done?',
          labelTaskNote: 'Short Note (Optional)',
          placeholderTaskNote: 'Helpful context or quick note...',
          labelTaskDeadline: 'Deadline (Optional)',
          labelPriority: 'Rule',
          labelTaskMandatory: 'Mandatory Task',
          addTaskBtn: 'Add to Vault',
          saveTaskBtn: 'Save Changes',
          cancelEditBtn: 'Cancel',
          inFocusTag: 'In Focus',
          moveUpAria: 'Move up',
          moveDownAria: 'Move down',
          dragAria: 'Drag to reorder',
          editAria: 'Edit task',
          deleteAria: 'Delete task',
          queueEmptyMsg: 'The Vault queue is empty. Add a task above.',
          completedEmptyMsg: 'No completed tasks recorded yet.',
          completedAtPrefix: 'Completed:',
          restoreBtn: 'Restore',
          clearHistoryBtn: 'Clear History',
          confirmClearText: 'Clear all completed tasks history?',
          confirmYes: 'Yes, Clear',
          confirmNo: 'Cancel',
          closeAria: 'Close'
        }
      };

      /* =========================================
         2. STATE & STORAGE MANAGEMENT
         ========================================= */
      const STORAGE_KEY = 'anti_overwhelm_focus_v1';
      const THEMES = ['navy', 'dark', 'light'];

      const defaultState = {
        theme: 'navy',
        lang: 'ar',
        slotCount: 1,
        slots: [null, null, null], // Holds task IDs for up to 3 focus slots
        restingSlots: [false, false, false], // Tracks manual pull state after Done
        queue: [], // Array of { id, title, note, deadline, manualMandatory, createdAt }
        completed: [] // Array of { id, title, note, deadline, manualMandatory, completedAt }
      };

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return structuredClone(defaultState);
          const parsed = JSON.parse(raw);
          return {
            theme: THEMES.includes(parsed.theme) ? parsed.theme : 'navy',
            lang: parsed.lang === 'en' ? 'en' : 'ar',
            slotCount: [1, 2, 3].includes(Number(parsed.slotCount)) ? Number(parsed.slotCount) : 1,
            slots: Array.isArray(parsed.slots) ? [parsed.slots[0] || null, parsed.slots[1] || null, parsed.slots[2] || null] : [null, null, null],
            restingSlots: Array.isArray(parsed.restingSlots) ? [Boolean(parsed.restingSlots[0]), Boolean(parsed.restingSlots[1]), Boolean(parsed.restingSlots[2])] : [false, false, false],
            queue: Array.isArray(parsed.queue) ? parsed.queue : [],
            completed: Array.isArray(parsed.completed) ? parsed.completed : []
          };
        } catch (err) {
          return structuredClone(defaultState);
        }
      }

      let state = loadState();
      let activeVaultTab = 'queue';
      let confirmClearHistory = false;

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (err) {
          // Ignore storage quota errors gracefully
        }
      }

      function t(key) {
        return I18N[state.lang][key] || key;
      }

      function generateId() {
        return 't_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
      }

      /* =========================================
         3. DEADLINE & MANDATORY EVALUATION LOGIC
         ========================================= */
      function getTaskStatus(task) {
        let isUrgent = false;
        let isOverdue = false;

        if (task.deadline) {
          const dueTime = new Date(task.deadline).getTime();
          if (!isNaN(dueTime)) {
            const now = Date.now();
            const diff = dueTime - now;
            if (diff <= 0) {
              isOverdue = true;
            } else if (diff <= 24 * 60 * 60 * 1000) {
              isUrgent = true;
            }
          }
        }

        const isMandatory = Boolean(task.manualMandatory) || isUrgent || isOverdue;
        return {
          isMandatory,
          isUrgent,
          isOverdue,
          isAutoMandatory: !task.manualMandatory && (isUrgent || isOverdue)
        };
      }

      function formatDateTime(isoString) {
        if (!isoString) return '';
        const date = new Date(isoString);
        if (isNaN(date.getTime())) return '';
        const locale = state.lang === 'ar' ? 'ar-EG' : 'en-US';
        return date.toLocaleString(locale, {
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      }

      /* =========================================
         4. SLOT SYNCHRONIZATION (ANTI-AUTO-PULL)
         ========================================= */
      function syncFocusSlots() {
        const queueMap = new Map(state.queue.map(item => [item.id, item]));

        // Clean up invalid IDs (deleted tasks)
        for (let i = 0; i < 3; i++) {
          if (state.slots[i] && !queueMap.has(state.slots[i])) {
            state.slots[i] = null;
          }
        }

        // Deduplicate across slots
        const seen = new Set();
        for (let i = 0; i < 3; i++) {
          if (state.slots[i]) {
            if (seen.has(state.slots[i])) {
              state.slots[i] = null;
            } else {
              seen.add(state.slots[i]);
            }
          }
        }

        // Fill empty non-resting visible slots from the top of the queue
        for (let i = 0; i < state.slotCount; i++) {
          if (!state.slots[i] && !state.restingSlots[i]) {
            const nextAvailable = state.queue.find(task => !seen.has(task.id));
            if (nextAvailable) {
              state.slots[i] = nextAvailable.id;
              seen.add(nextAvailable.id);
            }
          }
        }

        saveState();
      }

      function completeSlotTask(slotIndex) {
        const taskId = state.slots[slotIndex];
        if (!taskId) return;

        const idx = state.queue.findIndex(item => item.id === taskId);
        if (idx !== -1) {
          const [task] = state.queue.splice(idx, 1);
          state.completed.unshift({
            ...task,
            completedAt: new Date().toISOString()
          });
        }

        // Do NOT auto-pull next task: put this slot into calm resting state
        state.slots[slotIndex] = null;
        state.restingSlots[slotIndex] = true;
        saveState();
        renderAll();
      }

      function pullNextForSlot(slotIndex) {
        state.restingSlots[slotIndex] = false;
        syncFocusSlots();
        renderAll();
      }

      function deferSlotTask(slotIndex) {
        const taskId = state.slots[slotIndex];
        if (!taskId) return;

        const idx = state.queue.findIndex(item => item.id === taskId);
        if (idx === -1) return;

        const task = state.queue[idx];
        const status = getTaskStatus(task);
        if (status.isMandatory) return; // Mandatory tasks cannot be deferred

        // Move task to the very end of the queue
        state.queue.splice(idx, 1);
        state.queue.push(task);

        // Vacate slot and pull the next available task from the front
        state.slots[slotIndex] = null;
        state.restingSlots[slotIndex] = false;
        syncFocusSlots();
        renderAll();
      }

      /* =========================================
         5. DOM REFERENCES & INITIALIZATION
         ========================================= */
      const els = {
        themeBtn: document.getElementById('themeBtn'),
        themeLabel: document.getElementById('themeLabel'),
        langBtn: document.getElementById('langBtn'),
        langLabel: document.getElementById('langLabel'),
        slotSelector: document.getElementById('slotSelector'),
        openVaultBtn: document.getElementById('openVaultBtn'),
        vaultBtnText: document.getElementById('vaultBtnText'),
        focusStage: document.getElementById('focusStage'),
        vaultBackdrop: document.getElementById('vaultBackdrop'),
        vaultHeaderTitle: document.getElementById('vaultHeaderTitle'),
        closeVaultBtn: document.getElementById('closeVaultBtn'),
        tabQueue: document.getElementById('tabQueue'),
        tabQueueText: document.getElementById('tabQueueText'),
        queueCount: document.getElementById('queueCount'),
        tabCompleted: document.getElementById('tabCompleted'),
        tabCompletedText: document.getElementById('tabCompletedText'),
        completedCount: document.getElementById('completedCount'),
        queueView: document.getElementById('queueView'),
        completedView: document.getElementById('completedView'),
        taskForm: document.getElementById('taskForm'),
        editTaskId: document.getElementById('editTaskId'),
        labelTaskTitle: document.getElementById('labelTaskTitle'),
        taskTitleInput: document.getElementById('taskTitleInput'),
        labelTaskNote: document.getElementById('labelTaskNote'),
        taskNoteInput: document.getElementById('taskNoteInput'),
        labelTaskDeadline: document.getElementById('labelTaskDeadline'),
        taskDeadlineInput: document.getElementById('taskDeadlineInput'),
        labelMandatoryHeader: document.getElementById('labelMandatoryHeader'),
        labelTaskMandatory: document.getElementById('labelTaskMandatory'),
        taskMandatoryInput: document.getElementById('taskMandatoryInput'),
        cancelEditBtn: document.getElementById('cancelEditBtn'),
        submitTaskBtn: document.getElementById('submitTaskBtn'),
        queueList: document.getElementById('queueList'),
        completedToolbar: document.getElementById('completedToolbar'),
        completedList: document.getElementById('completedList')
      };

      function applyThemeAndLang() {
        document.documentElement.setAttribute('data-theme', state.theme);
        document.documentElement.lang = state.lang;
        document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
        document.title = t('appTitle');

        const themeNameKey = state.theme === 'navy' ? 'themeNavy' : state.theme === 'dark' ? 'themeDark' : 'themeLight';
        els.themeLabel.textContent = t(themeNameKey);
        els.langLabel.textContent = t('langSwitch');
        els.slotSelector.setAttribute('aria-label', t('slotsAria'));
        els.vaultBtnText.textContent = t('vaultBtn');
        els.vaultHeaderTitle.textContent = t('vaultBtn');
        els.closeVaultBtn.setAttribute('aria-label', t('closeAria'));

        els.tabQueueText.textContent = t('tabQueue');
        els.tabCompletedText.textContent = t('tabCompleted');

        els.labelTaskTitle.textContent = t('labelTaskTitle');
        els.taskTitleInput.placeholder = t('placeholderTaskTitle');
        els.labelTaskNote.textContent = t('labelTaskNote');
        els.taskNoteInput.placeholder = t('placeholderTaskNote');
        els.labelTaskDeadline.textContent = t('labelTaskDeadline');
        els.labelMandatoryHeader.textContent = t('labelPriority');
        els.labelTaskMandatory.textContent = t('labelTaskMandatory');
        els.cancelEditBtn.textContent = t('cancelEditBtn');
        els.submitTaskBtn.textContent = els.editTaskId.value ? t('saveTaskBtn') : t('addTaskBtn');

        // Update active slot selector buttons
        els.slotSelector.querySelectorAll('.slot-btn').forEach(btn => {
          btn.classList.toggle('active', Number(btn.dataset.slots) === state.slotCount);
        });
      }

      /* =========================================
         6. RENDER MAIN FOCUS STAGE
         ========================================= */
      function renderFocusStage() {
        els.focusStage.innerHTML = '';
        const queueMap = new Map(state.queue.map(item => [item.id, item]));
        const visibleSlots = state.slots.slice(0, state.slotCount);
        const activeIds = new Set(visibleSlots.filter(Boolean));
        const unpulledTasksExist = state.queue.some(task => !activeIds.has(task.id));

        for (let i = 0; i < state.slotCount; i++) {
          const taskId = state.slots[i];
          const task = taskId ? queueMap.get(taskId) : null;

          if (task) {
            const status = getTaskStatus(task);
            const card = document.createElement('article');
            card.className = 'focus-card';
            if (status.isOverdue) card.classList.add('is-overdue');
            else if (status.isMandatory) card.classList.add('is-mandatory');

            // Badges (Mandatory / Deadline)
            const hasBadges = status.isMandatory || task.deadline;
            if (hasBadges) {
              const badgesRow = document.createElement('div');
              badgesRow.className = 'card-badges';

              if (status.isMandatory) {
                const mBadge = document.createElement('span');
                mBadge.className = 'badge badge-mandatory';
                mBadge.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg><span>${status.isAutoMandatory ? t('mandatoryAutoBadge') : t('mandatoryBadge')}</span>`;
                badgesRow.appendChild(mBadge);
              }

              if (task.deadline) {
                const dBadge = document.createElement('span');
                dBadge.className = 'badge badge-deadline';
                if (status.isOverdue) dBadge.classList.add('overdue');
                else if (status.isUrgent) dBadge.classList.add('urgent');

                const labelText = status.isOverdue
                  ? `${t('overdueBadge')} (${formatDateTime(task.deadline)})`
                  : `${t('deadlinePrefix')} ${formatDateTime(task.deadline)}`;

                dBadge.innerHTML = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span>${labelText}</span>`;
                badgesRow.appendChild(dBadge);
              }

              card.appendChild(badgesRow);
            }

            // Title
            const titleEl = document.createElement('h1');
            titleEl.className = 'task-title';
            titleEl.textContent = task.title;
            card.appendChild(titleEl);

            // Optional Note
            if (task.note && task.note.trim()) {
              const noteEl = document.createElement('p');
              noteEl.className = 'task-note';
              noteEl.textContent = task.note;
              card.appendChild(noteEl);
            }

            // Action Buttons
            const actionsRow = document.createElement('div');
            actionsRow.className = 'card-actions';

            const doneBtn = document.createElement('button');
            doneBtn.type = 'button';
            doneBtn.className = 'btn-done';
            doneBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg><span>${t('doneBtn')}</span>`;
            doneBtn.addEventListener('click', () => completeSlotTask(i));
            actionsRow.appendChild(doneBtn);

            // Defer button hidden completely if Mandatory
            if (!status.isMandatory) {
              const deferBtn = document.createElement('button');
              deferBtn.type = 'button';
              deferBtn.className = 'btn-defer';
              deferBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg><span>${t('deferBtn')}</span>`;
              deferBtn.addEventListener('click', () => deferSlotTask(i));
              actionsRow.appendChild(deferBtn);
            }

            card.appendChild(actionsRow);
            els.focusStage.appendChild(card);
          } else if (state.restingSlots[i]) {
            // Calm Resting Card after pressing Done (Manual Pull)
            const restCard = document.createElement('div');
            restCard.className = 'rest-card';

            restCard.innerHTML = `
              <div class="rest-icon">
                <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
              </div>
              <p class="rest-message">${t('completedMsg')}</p>
              <p class="rest-sub">${unpulledTasksExist ? t('completedSubWithQueue') : t('completedSubEmpty')}</p>
            `;

            if (unpulledTasksExist) {
              const pullBtn = document.createElement('button');
              pullBtn.type = 'button';
              pullBtn.className = 'btn-pull';
              pullBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 5v14m-7-7h14"/></svg><span>${t('pullNextBtn')}</span>`;
              pullBtn.addEventListener('click', () => pullNextForSlot(i));
              restCard.appendChild(pullBtn);
            }

            els.focusStage.appendChild(restCard);
          } else {
            // Vault is empty for this slot
            const emptyCard = document.createElement('div');
            emptyCard.className = 'rest-card';

            emptyCard.innerHTML = `
              <div class="rest-icon empty-vault-icon">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8m-4-4h8"/></svg>
              </div>
              <p class="rest-message">${t('emptyVaultTitle')}</p>
              <p class="rest-sub">${t('emptyVaultSub')}</p>
            `;

            if (i === 0) {
              const openBtn = document.createElement('button');
              openBtn.type = 'button';
              openBtn.className = 'btn-pull';
              openBtn.textContent = t('openVaultAction');
              openBtn.addEventListener('click', openVaultModal);
              emptyCard.appendChild(openBtn);
            }

            els.focusStage.appendChild(emptyCard);
          }
        }
      }

      /* =========================================
         7. RENDER VAULT QUEUE & COMPLETED LISTS
         ========================================= */
      function renderVaultLists() {
        els.queueCount.textContent = state.queue.length;
        els.completedCount.textContent = state.completed.length;

        // Render Queue List
        els.queueList.innerHTML = '';
        if (state.queue.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty-list-msg';
          empty.textContent = t('queueEmptyMsg');
          els.queueList.appendChild(empty);
        } else {
          const visibleSlotIds = new Set(state.slots.slice(0, state.slotCount).filter(Boolean));

          state.queue.forEach((task, index) => {
            const status = getTaskStatus(task);
            const isInFocus = visibleSlotIds.has(task.id);

            const item = document.createElement('div');
            item.className = 'list-item' + (isInFocus ? ' is-active-slot' : '');
            item.dataset.index = index;
            item.dataset.id = task.id;

            // Drag Handle (≡)
            const dragHandle = document.createElement('div');
            dragHandle.className = 'drag-handle';
            dragHandle.setAttribute('aria-label', t('dragAria'));
            dragHandle.textContent = '≡';
            setupPointerDrag(dragHandle, item, index);
            item.appendChild(dragHandle);

            // Content
            const content = document.createElement('div');
            content.className = 'item-content';

            const title = document.createElement('div');
            title.className = 'item-title';
            title.textContent = task.title;
            content.appendChild(title);

            if (task.note && task.note.trim()) {
              const note = document.createElement('div');
              note.className = 'item-note';
              note.textContent = task.note;
              content.appendChild(note);
            }

            const meta = document.createElement('div');
            meta.className = 'item-meta';

            if (isInFocus) {
              const focusTag = document.createElement('span');
              focusTag.className = 'mini-tag active-tag';
              focusTag.textContent = t('inFocusTag');
              meta.appendChild(focusTag);
            }

            if (status.isMandatory) {
              const mTag = document.createElement('span');
              mTag.className = 'mini-tag mandatory-tag';
              mTag.textContent = status.isAutoMandatory ? t('mandatoryAutoBadge') : t('mandatoryBadge');
              meta.appendChild(mTag);
            }

            if (task.deadline) {
              const dTag = document.createElement('span');
              dTag.className = 'mini-tag' + (status.isOverdue ? ' overdue-tag' : '');
              dTag.textContent = formatDateTime(task.deadline);
              meta.appendChild(dTag);
            }

            if (meta.children.length > 0) {
              content.appendChild(meta);
            }

            item.appendChild(content);

            // Controls: Up (↑), Down (↓), Edit, Delete
            const controls = document.createElement('div');
            controls.className = 'item-controls';

            const upBtn = document.createElement('button');
            upBtn.type = 'button';
            upBtn.className = 'ctrl-btn';
            upBtn.disabled = index === 0;
            upBtn.setAttribute('aria-label', t('moveUpAria'));
            upBtn.textContent = '↑';
            upBtn.addEventListener('click', () => moveQueueItem(index, index - 1));
            controls.appendChild(upBtn);

            const downBtn = document.createElement('button');
            downBtn.type = 'button';
            downBtn.className = 'ctrl-btn';
            downBtn.disabled = index === state.queue.length - 1;
            downBtn.setAttribute('aria-label', t('moveDownAria'));
            downBtn.textContent = '↓';
            downBtn.addEventListener('click', () => moveQueueItem(index, index + 1));
            controls.appendChild(downBtn);

            const editBtn = document.createElement('button');
            editBtn.type = 'button';
            editBtn.className = 'ctrl-btn';
            editBtn.setAttribute('aria-label', t('editAria'));
            editBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;
            editBtn.addEventListener('click', () => startEditTask(task));
            controls.appendChild(editBtn);

            const delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.className = 'ctrl-btn danger';
            delBtn.setAttribute('aria-label', t('deleteAria'));
            delBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`;
            delBtn.addEventListener('click', () => deleteQueueTask(task.id));
            controls.appendChild(delBtn);

            item.appendChild(controls);
            els.queueList.appendChild(item);
          });
        }

        // Render Completed List
        els.completedToolbar.innerHTML = '';
        els.completedList.innerHTML = '';

        if (state.completed.length > 0) {
          if (confirmClearHistory) {
            const bar = document.createElement('div');
            bar.className = 'confirm-bar';
            bar.innerHTML = `<span>${t('confirmClearText')}</span>`;

            const btns = document.createElement('div');
            btns.style.display = 'flex';
            btns.style.gap = '0.5rem';

            const yesBtn = document.createElement('button');
            yesBtn.type = 'button';
            yesBtn.className = 'btn-clear-history';
            yesBtn.textContent = t('confirmYes');
            yesBtn.addEventListener('click', () => {
              state.completed = [];
              confirmClearHistory = false;
              saveState();
              renderVaultLists();
            });

            const noBtn = document.createElement('button');
            noBtn.type = 'button';
            noBtn.className = 'btn-secondary';
            noBtn.textContent = t('confirmNo');
            noBtn.addEventListener('click', () => {
              confirmClearHistory = false;
              renderVaultLists();
            });

            btns.appendChild(yesBtn);
            btns.appendChild(noBtn);
            bar.appendChild(btns);
            els.completedToolbar.appendChild(bar);
          } else {
            const clearBtn = document.createElement('button');
            clearBtn.type = 'button';
            clearBtn.className = 'btn-clear-history';
            clearBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span>${t('clearHistoryBtn')}</span>`;
            clearBtn.addEventListener('click', () => {
              confirmClearHistory = true;
              renderVaultLists();
            });
            els.completedToolbar.appendChild(clearBtn);
          }
        }

        if (state.completed.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty-list-msg';
          empty.textContent = t('completedEmptyMsg');
          els.completedList.appendChild(empty);
        } else {
          state.completed.forEach(task => {
            const item = document.createElement('div');
            item.className = 'list-item';

            const content = document.createElement('div');
            content.className = 'item-content';

            const title = document.createElement('div');
            title.className = 'item-title';
            title.textContent = task.title;
            content.appendChild(title);

            const meta = document.createElement('div');
            meta.className = 'item-meta';
            const timeTag = document.createElement('span');
            timeTag.className = 'mini-tag';
            timeTag.textContent = `${t('completedAtPrefix')} ${formatDateTime(task.completedAt)}`;
            meta.appendChild(timeTag);
            content.appendChild(meta);

            item.appendChild(content);

            const restoreBtn = document.createElement('button');
            restoreBtn.type = 'button';
            restoreBtn.className = 'btn-secondary';
            restoreBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg><span>${t('restoreBtn')}</span>`;
            restoreBtn.addEventListener('click', () => restoreCompletedTask(task.id));
            item.appendChild(restoreBtn);

            els.completedList.appendChild(item);
          });
        }
      }

      /* =========================================
         8. UNIFIED POINTER DRAG & DROP REORDERING
         ========================================= */
      function setupPointerDrag(handle, itemEl, startIndex) {
        handle.addEventListener('pointerdown', (e) => {
          if (e.button !== undefined && e.button !== 0) return;
          e.preventDefault();

          const listEl = els.queueList;
          const items = Array.from(listEl.querySelectorAll('.list-item'));
          if (items.length < 2) return;

          let currentIndex = startIndex;
          const startY = e.clientY;
          itemEl.classList.add('dragging');
          handle.setPointerCapture(e.pointerId);

          const onPointerMove = (moveEvent) => {
            const dy = moveEvent.clientY - startY;
            itemEl.style.transform = `translateY(${dy}px)`;

            const currentRect = itemEl.getBoundingClientRect();
            const currentMidY = currentRect.top + currentRect.height / 2;

            const updatedItems = Array.from(listEl.querySelectorAll('.list-item'));
            for (let i = 0; i < updatedItems.length; i++) {
              if (i === currentIndex) continue;
              const targetRect = updatedItems[i].getBoundingClientRect();
              const targetMidY = targetRect.top + targetRect.height / 2;

              if (i < currentIndex && currentMidY < targetMidY) {
                moveQueueItemSilent(currentIndex, i);
                currentIndex = i;
                break;
              } else if (i > currentIndex && currentMidY > targetMidY) {
                moveQueueItemSilent(currentIndex, i);
                currentIndex = i;
                break;
              }
            }
          };

          const onPointerUp = () => {
            handle.removeEventListener('pointermove', onPointerMove);
            handle.removeEventListener('pointerup', onPointerUp);
            handle.removeEventListener('pointercancel', onPointerUp);
            itemEl.classList.remove('dragging');
            itemEl.style.transform = '';
            saveState();
            renderAll();
          };

          handle.addEventListener('pointermove', onPointerMove);
          handle.addEventListener('pointerup', onPointerUp);
          handle.addEventListener('pointercancel', onPointerUp);
        });
      }

      function moveQueueItemSilent(fromIdx, toIdx) {
        if (fromIdx === toIdx || fromIdx < 0 || toIdx < 0 || fromIdx >= state.queue.length || toIdx >= state.queue.length) return;
        const [moved] = state.queue.splice(fromIdx, 1);
        state.queue.splice(toIdx, 0, moved);

        // Visually reorder DOM nodes smoothly during active drag
        const nodes = Array.from(els.queueList.children);
        const movingNode = nodes[fromIdx];
        if (movingNode) {
          if (toIdx >= nodes.length - 1) {
            els.queueList.appendChild(movingNode);
          } else {
            const refNode = fromIdx < toIdx ? nodes[toIdx].nextSibling : nodes[toIdx];
            els.queueList.insertBefore(movingNode, refNode);
          }
        }
      }

      function moveQueueItem(fromIdx, toIdx) {
        if (fromIdx === toIdx || toIdx < 0 || toIdx >= state.queue.length) return;
        const [moved] = state.queue.splice(fromIdx, 1);
        state.queue.splice(toIdx, 0, moved);
        saveState();
        renderAll();
      }

      /* =========================================
         9. CRUD OPERATIONS IN THE VAULT
         ========================================= */
      function resetTaskForm() {
        els.editTaskId.value = '';
        els.taskTitleInput.value = '';
        els.taskNoteInput.value = '';
        els.taskDeadlineInput.value = '';
        els.taskMandatoryInput.checked = false;
        els.cancelEditBtn.style.display = 'none';
        els.submitTaskBtn.textContent = t('addTaskBtn');
      }

      function startEditTask(task) {
        els.editTaskId.value = task.id;
        els.taskTitleInput.value = task.title;
        els.taskNoteInput.value = task.note || '';
        els.taskDeadlineInput.value = task.deadline || '';
        els.taskMandatoryInput.checked = Boolean(task.manualMandatory);
        els.cancelEditBtn.style.display = 'inline-flex';
        els.submitTaskBtn.textContent = t('saveTaskBtn');
        els.taskTitleInput.focus();
      }

      function deleteQueueTask(taskId) {
        state.queue = state.queue.filter(item => item.id !== taskId);
        if (els.editTaskId.value === taskId) {
          resetTaskForm();
        }
        syncFocusSlots();
        renderAll();
      }

      function restoreCompletedTask(taskId) {
        const idx = state.completed.findIndex(item => item.id === taskId);
        if (idx === -1) return;

        const [restored] = state.completed.splice(idx, 1);
        delete restored.completedAt;
        state.queue.push(restored);
        syncFocusSlots();
        renderAll();
      }

      /* =========================================
         10. EVENT LISTENERS
         ========================================= */
      els.themeBtn.addEventListener('click', () => {
        const nextIdx = (THEMES.indexOf(state.theme) + 1) % THEMES.length;
        state.theme = THEMES[nextIdx];
        saveState();
        applyThemeAndLang();
      });

      els.langBtn.addEventListener('click', () => {
        state.lang = state.lang === 'ar' ? 'en' : 'ar';
        saveState();
        renderAll();
      });

      els.slotSelector.addEventListener('click', (e) => {
        const btn = e.target.closest('.slot-btn');
        if (!btn) return;
        const count = Number(btn.dataset.slots);
        if ([1, 2, 3].includes(count) && count !== state.slotCount) {
          state.slotCount = count;
          // Clear resting flags on newly revealed slots so user immediately sees tasks
          for (let i = 0; i < count; i++) {
            if (!state.slots[i]) {
              state.restingSlots[i] = false;
            }
          }
          syncFocusSlots();
          renderAll();
        }
      });

      function openVaultModal() {
        confirmClearHistory = false;
        els.vaultBackdrop.classList.add('open');
        renderVaultLists();
      }

      function closeVaultModal() {
        els.vaultBackdrop.classList.remove('open');
        resetTaskForm();
        confirmClearHistory = false;
      }

      els.openVaultBtn.addEventListener('click', openVaultModal);
      els.closeVaultBtn.addEventListener('click', closeVaultModal);
      els.vaultBackdrop.addEventListener('click', (e) => {
        if (e.target === els.vaultBackdrop) closeVaultModal();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && els.vaultBackdrop.classList.contains('open')) {
          closeVaultModal();
        }
      });

      els.tabQueue.addEventListener('click', () => {
        activeVaultTab = 'queue';
        confirmClearHistory = false;
        els.tabQueue.classList.add('active');
        els.tabQueue.setAttribute('aria-selected', 'true');
        els.tabCompleted.classList.remove('active');
        els.tabCompleted.setAttribute('aria-selected', 'false');
        els.queueView.style.display = 'block';
        els.completedView.style.display = 'none';
      });

      els.tabCompleted.addEventListener('click', () => {
        activeVaultTab = 'completed';
        els.tabCompleted.classList.add('active');
        els.tabCompleted.setAttribute('aria-selected', 'true');
        els.tabQueue.classList.remove('active');
        els.tabQueue.setAttribute('aria-selected', 'false');
        els.completedView.style.display = 'block';
        els.queueView.style.display = 'none';
        renderVaultLists();
      });

      els.cancelEditBtn.addEventListener('click', resetTaskForm);

      els.taskForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const title = els.taskTitleInput.value.trim();
        if (!title) return;

        const note = els.taskNoteInput.value.trim();
        const deadline = els.taskDeadlineInput.value || '';
        const manualMandatory = els.taskMandatoryInput.checked;
        const editingId = els.editTaskId.value;

        if (editingId) {
          const existing = state.queue.find(item => item.id === editingId);
          if (existing) {
            existing.title = title;
            existing.note = note;
            existing.deadline = deadline;
            existing.manualMandatory = manualMandatory;
          }
        } else {
          state.queue.push({
            id: generateId(),
            title,
            note,
            deadline,
            manualMandatory,
            createdAt: new Date().toISOString()
          });
        }

        resetTaskForm();
        syncFocusSlots();
        renderAll();
      });

      /* =========================================
         11. INITIAL RENDER & PERIODIC DEADLINE CHECK
         ========================================= */
      function renderAll() {
        applyThemeAndLang();
        renderFocusStage();
        renderVaultLists();
      }

      syncFocusSlots();
      renderAll();

      // Re-evaluate deadlines every 60 seconds so tasks automatically become mandatory on time
      setInterval(() => {
        renderFocusStage();
        if (els.vaultBackdrop.classList.contains('open')) {
          renderVaultLists();
        }
      }, 60000);
    })();
  </script>
</body>
